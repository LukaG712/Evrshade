# Evershade — Full Ecosystem
#
# Profiles:
#   docker compose --profile minimal up      # Core services only
#   docker compose --profile standard up     # All services except dashboard
#   docker compose --profile full up         # Everything including Slammer
#   docker compose --profile monitoring up   # Grafana + Prometheus + Loki + Tempo + cAdvisor + node-exporter
#   docker compose --profile opik up        # Opik for LLM observability
#   docker compose --profile langfuse up    # Langfuse for AI observability
#   docker compose --profile browser-use up # Browser Use for LLM browser automation
#   docker compose --profile playwright-mcp up # Playwright MCP for MCP browser automation
#   docker compose --profile ollama up       # Ollama for local models
#   docker compose --profile proxy up        # Caddy reverse proxy with TLS
#   docker compose --profile dev up          # Development mode with all ports exposed
#
# Combined profiles:
#   docker compose --profile full --profile monitoring up   # Everything + monitoring
#
# Modes:
#   Set EVERSHADE_MODE=server in .env for headless server deployment
#   Default (desktop) binds to loopback only

name: evershade

networks:
  internal:
    driver: bridge
    internal: false
  frontend:
    driver: bridge

volumes:
  redis_data:
  greenie_data:
  slinker_logs:
  gobber_data:
  sneaker_data:
  hider_data:
  poltergeist_data:
  ollama_data:
  caddy_data:
  caddy_config:
  # Monitoring persistent storage
  prometheus_data:
  grafana_data:
  # Opik persistent storage
  opik_data:
  # Loki persistent storage
  loki_data:
  # Tempo persistent storage
  tempo_data:
  # Langfuse persistent storage
  langfuse_data:
  langfuse_postgres_data:

# ═══════════════════════════════════════════════════════════════════
# Infrastructure
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:8.10.2-alpine
    networks:
      - internal
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${EVERSHADE_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${EVERSHADE_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

# ═══════════════════════════════════════════════════════════════════
# Core Services (Required)
# ═══════════════════════════════════════════════════════════════════

  Greenie:
    image: evershade-greenie
    build:
      context: .
      dockerfile: services/Greenie/Dockerfile
    profiles: ["minimal", "standard", "full", "dev"]
    networks:
      - internal
      - frontend
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      # API Key (new naming + legacy alias)
      - API_KEY=${EVERSHADE_GREENIE_API_KEY}
      - EVERSHADE_GREENIE_API_KEY=${EVERSHADE_GREENIE_API_KEY}
      - HUB_API_KEY=${EVERSHADE_GREENIE_API_KEY}
      - HUB_PORT=8080
      - HUB_TIMEOUT=1800
      - JUNIE_BIN=${EVERSHADE_JUNIE_BIN:-junie}
      # Service URLs (internal network)
      - SLINKER_URL=http://Slinker:8000
      - TRAPPER_URL=http://Trapper-api:3000
      - GOBBER_URL=http://Gobber:8085
      - SNEAKER_URL=http://Sneaker:8086
      - HIDER_URL=http://Hider:8087
      - POLTERGEIST_URL=http://Poltergeist:8088
      - SHREWD_URL=http://Shrewd:8089
      # OpenTelemetry
      - SNEAKER_OTLP_ENDPOINT=http://Sneaker:8086
      # Tempo (optional distributed tracing)
      - TEMPO_OTLP_ENDPOINT=http://tempo:4317
      # Service API Keys (new naming + legacy aliases)
      - EVERSHADE_SLINKER_API_KEY=${EVERSHADE_SLINKER_API_KEY}
      - SLINKER_API_KEY=${EVERSHADE_SLINKER_API_KEY}
      - EVERSHADE_TRAPPER_API_KEY=${EVERSHADE_TRAPPER_API_KEY}
      - TRAPPER_API_KEY=${EVERSHADE_TRAPPER_API_KEY}
      - EVERSHADE_GOBBER_API_KEY=${EVERSHADE_GOBBER_API_KEY}
      - GOBBER_API_KEY=${EVERSHADE_GOBBER_API_KEY}
      - EVERSHADE_SNEAKER_API_KEY=${EVERSHADE_SNEAKER_API_KEY}
      - SNEAKER_API_KEY=${EVERSHADE_SNEAKER_API_KEY}
      - EVERSHADE_HIDER_API_KEY=${EVERSHADE_HIDER_API_KEY}
      - HIDER_API_KEY=${EVERSHADE_HIDER_API_KEY}
      - EVERSHADE_POLTERGEIST_API_KEY=${EVERSHADE_POLTERGEIST_API_KEY}
      - POLTERGEIST_API_KEY=${EVERSHADE_POLTERGEIST_API_KEY}
      - EVERSHADE_SHREWD_API_KEY=${EVERSHADE_SHREWD_API_KEY}
      - SHREWD_API_KEY=${EVERSHADE_SHREWD_API_KEY}
      # Ollama
      - OLLAMA_URL=${EVERSHADE_OLLAMA_URL:-http://host.docker.internal:11434}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${EVERSHADE_REDIS_PASSWORD}
      - REDIS_DB=0
      # Deployment
      - EVERSHADE_MODE=${EVERSHADE_MODE:-desktop}
      - EVERSHADE_PUBLIC_URL=${EVERSHADE_PUBLIC_URL:-http://localhost:8080}
      # Logging
      - LOG_LEVEL=${EVERSHADE_LOG_LEVEL:-INFO}
    volumes:
      - ./services/Greenie/hub.yaml:/app/hub.yaml:ro
      - greenie_data:/app/data
      - ./services/Greenie/skills:/app/skills:ro
      - ${EVERSHADE_WORKSPACE_PATH:-./workspace}:/workspace
    depends_on:
      redis:
        condition: service_healthy
      Slinker:
        condition: service_healthy
      Trapper-api:
        condition: service_healthy
      Gobber:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.50'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /data

  Slinker:
    image: evershade-slinker
    build:
      context: .
      dockerfile: services/Slinker/Dockerfile
    profiles: ["minimal", "standard", "full", "dev"]
    networks:
      - internal
    # No host port — only accessible via Greenie or internal network
    environment:
      - API_KEY=${EVERSHADE_SLINKER_API_KEY}
      - PORT=8000
      - JUNIE_TIMEOUT=1800
      - JUNIE_BIN=${EVERSHADE_JUNIE_BIN:-junie}
      - WORKSPACE_PATH=/workspace
      - MAX_CONCURRENT_WORKERS=${EVERSHADE_MAX_CONCURRENT_WORKERS:-1}
      - ISOLATION_MODE=${EVERSHADE_ISOLATION_MODE:-container}
      - SHREWD_URL=http://Shrewd:8089
      - OLLAMA_URL=${EVERSHADE_OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${EVERSHADE_OLLAMA_MODEL:-gemma4:12b}
      - REFINE_PROMPT=${EVERSHADE_REFINE_PROMPT:-false}
      - LOG_LEVEL=${EVERSHADE_LOG_LEVEL:-INFO}
      # OpenTelemetry
      - SNEAKER_OTLP_ENDPOINT=http://Sneaker:8086
      # Tempo (optional distributed tracing)
      - TEMPO_OTLP_ENDPOINT=http://tempo:4317
    volumes:
      - ${EVERSHADE_WORKSPACE_PATH:-./workspace}:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.50'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
      - /data

  Trapper-api:
    image: evershade-trapper-api
    build:
      context: .
      dockerfile: services/Trapper/Dockerfile
    profiles: ["minimal", "standard", "full", "dev"]
    networks:
      - internal
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - API_KEY=${EVERSHADE_TRAPPER_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_MAX=60
      - RATE_LIMIT_WINDOW_MS=60000
      - SCRAPE_TIMEOUT=${EVERSHADE_SCRAPE_TIMEOUT:-30000}
      - SCRAPE_ONLY_MAIN_CONTENT=true
      - SCRAPE_BLOCK_ADS=true
      - CRAWL_MAX_DEPTH=${EVERSHADE_CRAWL_MAX_DEPTH:-10}
      - CRAWL_MAX_PAGES=${EVERSHADE_CRAWL_MAX_PAGES:-100}
      - CRAWL_MAX_CONCURRENCY=${EVERSHADE_CRAWL_MAX_CONCURRENCY:-5}
      - CRAWL_DELAY=1000
      - BROWSER_HEADLESS=${EVERSHADE_BROWSER_HEADLESS:-true}
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  Trapper-worker:
    image: evershade-trapper-worker
    build:
      context: .
      dockerfile: services/Trapper/Dockerfile
    profiles: ["minimal", "standard", "full", "dev"]
    networks:
      - internal
    command: node dist/worker.js
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - API_KEY=${EVERSHADE_TRAPPER_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCRAPE_TIMEOUT=${EVERSHADE_SCRAPE_TIMEOUT:-30000}
      - SCRAPE_ONLY_MAIN_CONTENT=true
      - SCRAPE_BLOCK_ADS=true
      - CRAWL_MAX_DEPTH=${EVERSHADE_CRAWL_MAX_DEPTH:-10}
      - CRAWL_MAX_PAGES=${EVERSHADE_CRAWL_MAX_PAGES:-100}
      - CRAWL_MAX_CONCURRENCY=${EVERSHADE_CRAWL_MAX_CONCURRENCY:-5}
      - CRAWL_DELAY=1000
      - BROWSER_HEADLESS=${EVERSHADE_BROWSER_HEADLESS:-true}
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  Gobber:
    image: evershade-gobber
    build:
      context: .
      dockerfile: services/Gobber/Dockerfile
    profiles: ["minimal", "standard", "full", "dev"]
    networks:
      - internal
    environment:
      - API_KEY=${EVERSHADE_GOBBER_API_KEY}
      - DB_PATH=/app/data/gobber.db
      - REDIS_URL=redis://:${EVERSHADE_REDIS_PASSWORD}@redis:6379/1
      - OBSIDIAN_VAULT_PATH=${EVERSHADE_OBSIDIAN_VAULT_PATH:-/app/vault}
      - SHREWD_URL=http://Shrewd:8089
      - SHREWD_API_KEY=${EVERSHADE_SHREWD_API_KEY}
      - LOG_LEVEL=${EVERSHADE_LOG_LEVEL:-INFO}
      # OpenTelemetry
      - SNEAKER_OTLP_ENDPOINT=http://Sneaker:8086
      # Tempo (optional distributed tracing)
      - TEMPO_OTLP_ENDPOINT=http://tempo:4317
    volumes:
      - ${EVERSHADE_OBSIDIAN_VAULT_PATH:-./obsidian-vault}:/app/vault:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
      - /data

# ═══════════════════════════════════════════════════════════════════
# Supporting Services (Optional)
# ═══════════════════════════════════════════════════════════════════

  Sneaker:
    image: evershade-sneaker
    build:
      context: .
      dockerfile: services/Sneaker/Dockerfile
    profiles: ["standard", "full", "dev"]
    networks:
      - internal
    environment:
      - API_KEY=${EVERSHADE_SNEAKER_API_KEY}
      - DB_PATH=/app/data/sneaker.db
      - LOG_LEVEL=${EVERSHADE_LOG_LEVEL:-INFO}
      # OpenTelemetry
      - SNEAKER_OTLP_ENDPOINT=http://localhost:8086
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
      - /data

  Hider:
    image: evershade-hider
    build:
      context: .
      dockerfile: services/Hider/Dockerfile
    profiles: ["standard", "full", "dev"]
    networks:
      - internal
    environment:
      - API_KEY=${EVERSHADE_HIDER_API_KEY}
      - ENCRYPTION_KEY=${EVERSHADE_ENCRYPTION_KEY}
      - ENCRYPTION_SALT=${EVERSHADE_ENCRYPTION_SALT}
      - DB_PATH=/app/data/hider.db
      - LOG_LEVEL=${EVERSHADE_LOG_LEVEL:-INFO}
      # OpenTelemetry
      - SNEAKER_OTLP_ENDPOINT=http://Sneaker:8086
      # Tempo (optional distributed tracing)
      - TEMPO_OTLP_ENDPOINT=http://tempo:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
      - /data

  Poltergeist:
    image: evershade-poltergeist
    build:
      context: .
      dockerfile: services/Poltergeist/Dockerfile
    profiles: ["standard", "full", "dev"]
    networks:
      - internal
    environment:
      - API_KEY=${EVERSHADE_POLTERGEIST_API_KEY}
      - DB_PATH=/app/data/poltergeist.db
      - LOG_LEVEL=${EVERSHADE_LOG_LEVEL:-INFO}
      # Notification delivery
      - SLACK_WEBHOOK_URL=${EVERSHADE_SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${EVERSHADE_DISCORD_WEBHOOK_URL:-}
      - SMTP_HOST=${EVERSHADE_SMTP_HOST:-localhost}
      - SMTP_PORT=${EVERSHADE_SMTP_PORT:-587}
      - SMTP_USER=${EVERSHADE_SMTP_USER:-}
      - SMTP_PASSWORD=${EVERSHADE_SMTP_PASSWORD:-}
      - SMTP_FROM=${EVERSHADE_SMTP_FROM:-noreply@evershade.local}
      - SMTP_TLS=${EVERSHADE_SMTP_TLS:-true}
      - TELEGRAM_BOT_TOKEN=${EVERSHADE_TELEGRAM_BOT_TOKEN:-}
      - POLTERGEIST_REQUEST_TIMEOUT=${EVERSHADE_POLTERGEIST_REQUEST_TIMEOUT:-30}
      # OpenTelemetry
      - SNEAKER_OTLP_ENDPOINT=http://Sneaker:8086
      # Tempo (optional distributed tracing)
      - TEMPO_OTLP_ENDPOINT=http://tempo:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
      - /data

  Shrewd:
    image: evershade-shrewd
    build:
      context: .
      dockerfile: services/Shrewd/Dockerfile
    profiles: ["standard", "full", "dev"]
    networks:
      - internal
    environment:
      - API_KEY=${EVERSHADE_SHREWD_API_KEY}
      - OPENAI_API_KEY=${EVERSHADE_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${EVERSHADE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      - ANTHROPIC_API_KEY=${EVERSHADE_ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${EVERSHADE_ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      - GOOGLE_API_KEY=${EVERSHADE_GOOGLE_API_KEY:-}
      - GOOGLE_BASE_URL=${EVERSHADE_GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - OLLAMA_URL=${EVERSHADE_OLLAMA_URL:-http://host.docker.internal:11434}
      - LOG_LEVEL=${EVERSHADE_LOG_LEVEL:-INFO}
      # OpenTelemetry
      - SNEAKER_OTLP_ENDPOINT=http://Sneaker:8086
      # Tempo (optional distributed tracing)
      - TEMPO_OTLP_ENDPOINT=http://tempo:4317
      # Opik (optional LLM observability)
      - OPIK_ENDPOINT=${OPIK_ENDPOINT:-http://opik:9000}
      # Langfuse (optional AI observability)
      - LANGFUSE_ENDPOINT=${LANGFUSE_ENDPOINT:-http://langfuse:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/data
      - /data

# ═══════════════════════════════════════════════════════════════════
# Frontend
# ═══════════════════════════════════════════════════════════════════

  Slammer:
    image: evershade-slammer
    build:
      context: .
      dockerfile: services/Slammer/Dockerfile
    profiles: ["full", "dev"]
    networks:
      - frontend
      - internal
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:5173:80"
    environment:
      - GREENIE_API_KEY=${EVERSHADE_GREENIE_API_KEY}
    depends_on:
      - Greenie
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d

# ═══════════════════════════════════════════════════════════════════
# Optional: Ollama (Local LLM)
# ═══════════════════════════════════════════════════════════════════

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ollama"]
    networks:
      - internal
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

# ═══════════════════════════════════════════════════════════════════
# Optional: Caddy Reverse Proxy (TLS)
# ═══════════════════════════════════════════════════════════════════

  caddy:
    image: caddy:2.11.6-alpine
    profiles: ["proxy"]
    networks:
      - frontend
      - internal
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      - EVERSHADE_GREENIE_API_KEY=${EVERSHADE_GREENIE_API_KEY}
      - EVERSHADE_SLINKER_API_KEY=${EVERSHADE_SLINKER_API_KEY}
      - EVERSHADE_TRAPPER_API_KEY=${EVERSHADE_TRAPPER_API_KEY}
      - EVERSHADE_GOBBER_API_KEY=${EVERSHADE_GOBBER_API_KEY}
      - EVERSHADE_SNEAKER_API_KEY=${EVERSHADE_SNEAKER_API_KEY}
      - EVERSHADE_HIDER_API_KEY=${EVERSHADE_HIDER_API_KEY}
      - EVERSHADE_POLTERGEIST_API_KEY=${EVERSHADE_POLTERGEIST_API_KEY}
      - EVERSHADE_SHREWD_API_KEY=${EVERSHADE_SHREWD_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - Greenie
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

# ═══════════════════════════════════════════════════════════════════
# Monitoring Stack (Optional — profile: monitoring)
# ═══════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoring"]
    networks:
      - internal
      - frontend
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    networks:
      - frontend
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/grafana/plugins

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["monitoring"]
    networks:
      - internal
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # cAdvisor requires SYS_ADMIN to read container cgroup stats.
    # This is less privileged than privileged: true, but still elevated.
    # For desktop use this is acceptable; for server deployments consider
    # running cAdvisor only on trusted hosts with firewall restrictions.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["monitoring"]
    networks:
      - internal
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

