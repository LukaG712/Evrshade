# ═══════════════════════════════════════════════════════════════════
# Langfuse — AI Observability (Optional)
# ═══════════════════════════════════════════════════════════════════

  langfuse-postgres:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    networks:
      - internal
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD}
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  langfuse:
    image: langfuse/langfuse:3
    profiles: ["langfuse"]
    networks:
      - internal
      - frontend
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:3101:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
      - SALT=${LANGFUSE_SALT}
      - AUTH_DISABLE_SIGNUP_WITHOUT_AUTH=true
      - AUTH_USERNAME=${LANGFUSE_USERNAME}
      - AUTH_PASSWORD=${LANGFUSE_PASSWORD}
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# ═══════════════════════════════════════════════════════════════════
# Browser Use — LLM Browser Automation (Optional)
# ═══════════════════════════════════════════════════════════════════

  browser-use:
    image: python:3.12-slim
    profiles: ["browser-use"]
    networks:
      - internal
    ports:
      - "${EVERSHADE_BIND_ADDRESS:-127.0.0.1}:8091:8091"
    environment:
      - OPENAI_API_KEY=${EVERSHADE_OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${EVERSHADE_ANTHROPIC_API_KEY:-}
      - BROWSER_USE_MODEL=${EVERSHADE_BROWSER_USE_MODEL:-gpt-4o}
      - BROWSER_USE_HEADLESS=true
    volumes:
      - ./integrations/browser-use:/app:ro
    command: >
      sh -c "pip install -q browser-use && python -m browser_use.server --host 0.0.0.0 --port 8091"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.50'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

