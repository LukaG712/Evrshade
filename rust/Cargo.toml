[workspace]
members = [
    "crates/evershade-core",
    "crates/evershade-db",
    "crates/evershade-events",
    "services/gobber",
    "services/greenie",
    "services/hider",
    "services/poltergeist",
    "services/shrewd",
    "services/slinker",
    "services/sneaker",
    "services/speedy",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Evrshade"]
license = "MIT"

[workspace.dependencies]
# HTTP framework
axum = { version = "0.8", features = ["macros", "tracing"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JWT auth
jsonwebtoken = "9"

# Logging & telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = "0.27"
opentelemetry-prometheus = "0.27"
prometheus = "0.13"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Database
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }

# Redis
redis = { version = "0.29", features = ["tokio-comp"] }

# Encryption
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Email
lettre = { version = "0.11", features = ["tokio1-rustls-tls"] }

# Protobuf / OTLP
prost = "0.13"
tonic = "0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
hex = "0.4"
url = "2"
ipnetwork = "0.20"
regex = "1"
once_cell = "1"
futures = "0.3"
bytes = "1"
http = "1"

# Dev dependencies
tokio-test = "0.4"
wiremock = "0.6"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
