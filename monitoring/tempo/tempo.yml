# Tempo configuration for Evershade
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m
  max_block_bytes: 1_000_000

compactor:
  compaction:
    block_retention: 30d
    compacted_block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

overrides:
  defaults:
    ingestion:
      max_bytes_per_trace: 50_000_000
      max_bytes_per_second: 10_000_000
    storage:
      trace_idle_period: 10s
