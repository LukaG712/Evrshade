apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      tracesToLogs:
        datasourceUid: 'loki'
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: 'prometheus'
      search:
        hide: false
      nodeGraph:
        enabled: true
