[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "evershade-cli"
version = "2.0.0"
description = "Evershade — Self-hosted AI agent platform CLI"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
evershade = "evershade_cli.main:cli"
