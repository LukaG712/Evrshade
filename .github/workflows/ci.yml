name: Evershade CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust formatting check (rustfmt)
        run: |
          cd rust && cargo fmt --all -- --check

      - name: Rust linting (clippy)
        run: |
          cd rust && cargo clippy --workspace -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install SQLite dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Run Rust tests
        run: |
          cd rust && cargo test --workspace -- --test-threads=1

  docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose file
        run: |
          docker compose config --quiet

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.82.11
        with:
          extra_args: --only-verified --exclude-paths ".junie/*"

      - name: Check for hardcoded secrets in config files
        run: |
          # Scan for common secret patterns in .env.example and docker-compose
          if grep -rn "change-me\|dev-key\|placeholder\|changeme" .env.example docker-compose.yml 2>/dev/null; then
            echo "WARNING: Found hardcoded default secrets in configuration files"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Check Docker image tags are pinned
        run: |
          # Ensure no :latest tags are used in docker-compose.yml
          if grep -E "image:.*:latest" docker-compose.yml 2>/dev/null; then
            echo "ERROR: Found unpinned :latest image tags in docker-compose.yml"
            exit 1
          fi
          echo "All Docker images use pinned tags"
