name: Evershade CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          pip install ruff

      - name: Python linting (ruff)
        run: |
          ruff check . --exclude .junie --config ruff.toml --output-format github

      - name: Python formatting check (ruff)
        run: |
          ruff format . --exclude .junie --config ruff.toml --check --diff

  docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Docker Compose file
        run: |
          docker compose config --quiet

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install safety
        run: |
          pip install safety

      - name: Check Python dependencies for known vulnerabilities
        run: |
          # Check all requirements.txt files for known CVEs
          find . -name "requirements.txt" -not -path "*/node_modules/*" -not -path "*/.junie/*" | \
            xargs -I {} safety check -r {} || true

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.82.11
        with:
          extra_args: --only-verified --exclude-paths ".junie/*"

      - name: Check for hardcoded secrets in config files
        run: |
          # Scan for common secret patterns in .env.example and docker-compose
          if grep -rn "change-me\|dev-key\|placeholder\|changeme" .env.example docker-compose.yml 2>/dev/null; then
            echo "WARNING: Found hardcoded default secrets in configuration files"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Check Docker image tags are pinned
        run: |
          # Ensure no :latest tags are used in docker-compose.yml
          if grep -E "image:.*:latest" docker-compose.yml 2>/dev/null; then
            echo "ERROR: Found unpinned :latest image tags in docker-compose.yml"
            exit 1
          fi
          echo "All Docker images use pinned tags"

      - name: Install test dependencies
        run: |
          pip install pytest pyyaml

      - name: Run security tests
        run: |
          pytest tests/test_install_gui_security.py \
                 tests/test_install_gui_win_security.py \
                 tests/test_docker_compose_security.py \
                 tests/test_caddyfile_security.py \
                 tests/test_env_example_security.py \
                 tests/test_round2_config_security.py \
                 tests/test_shell_scripts_security.py \
                 -v --tb=short

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evershade-core
        run: |
          pip install -e "packages/evershade-core[dev]"

      - name: Install evershade-events
        run: |
          pip install -e "packages/evershade-events[dev]"

      - name: Install evershade-db
        run: |
          pip install -e "packages/evershade-db[dev]"

      - name: Run evershade-core tests
        run: |
          cd packages/evershade-core && pytest tests/ -v --tb=short

      - name: Run evershade-events tests
        run: |
          cd packages/evershade-events && pytest tests/ -v --tb=short

      - name: Run evershade-db tests
        run: |
          cd packages/evershade-db && pytest tests/ -v --tb=short
